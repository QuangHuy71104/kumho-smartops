name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Typecheck, lint, build and test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Reject forbidden tracked files
        shell: bash
        run: |
          forbidden="$(git ls-files | grep -Ei '(^|/)\.env($|\.)|\.(docx?|pdf|p12|pfx|key|crt|dump)$' || true)"
          if [[ -n "$forbidden" ]]; then
            echo "::error::Repository contains a forbidden environment, document, key, certificate, or dump file."
            printf '%s\n' "$forbidden"
            exit 1
          fi

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: Dependency audit (production packages)
        run: npm audit --omit=dev --audit-level=high
