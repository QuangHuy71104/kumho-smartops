name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Typecheck, lint, build and test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.19.0
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Reject forbidden tracked files
        shell: bash
        run: |
          forbidden="$(git ls-files | grep -Ei '(^|/)\.env($|\.)|\.(docx?|pdf|p12|pfx|key|crt|dump)$' || true)"
          if [[ -n "$forbidden" ]]; then
            echo "::error::Repository contains a forbidden environment, document, key, certificate, or dump file."
            printf '%s\n' "$forbidden"
            exit 1
          fi

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: Dependency audit
        run: npm audit --audit-level=high

  database:
    name: PostgreSQL integration
    runs-on: ubuntu-latest
    timeout-minutes: 12

    services:
      postgres:
        image: postgres:17-alpine@sha256:18cfe3ef5e6815560c98237d6216d1e5119702fb0f3894c8785dd58b8bbe5d73
        env:
          POSTGRES_DB: ksops_ci
          POSTGRES_USER: ksops_ci
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ksops_ci -d ksops_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    env:
      MIGRATION_DATABASE_URL: postgresql://ksops_ci@127.0.0.1:5432/ksops_ci?sslmode=disable
      TEST_DATABASE_URL: postgresql://ksops_ci@127.0.0.1:5432/ksops_ci?sslmode=disable

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.19.0
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Require isolated database URLs
        shell: bash
        run: |
          : "${MIGRATION_DATABASE_URL:?MIGRATION_DATABASE_URL is required}"
          : "${TEST_DATABASE_URL:?TEST_DATABASE_URL is required}"

      - name: Apply PostgreSQL migrations
        run: npm run db:migrate

      - name: Load guarded synthetic pilot data
        shell: bash
        env:
          PGOPTIONS: -c ksops.environment=development -c ksops.allow_synthetic_seed=yes
        run: psql "$MIGRATION_DATABASE_URL" -X -v ON_ERROR_STOP=1 -f db/seeds/dev/001_synthetic_pilot.sql

      - name: Exercise PostgreSQL cargo transactions
        run: npm run test:integration:postgres
