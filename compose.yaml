services:
  postgres:
    image: postgres:17-alpine@sha256:18cfe3ef5e6815560c98237d6216d1e5119702fb0f3894c8785dd58b8bbe5d73
    environment:
      POSTGRES_DB: ksops_dev
      POSTGRES_USER: ksops_local
      POSTGRES_PASSWORD: ksops_local_only
    ports:
      - "127.0.0.1:55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ksops_local -d ksops_dev"]
      interval: 2s
      timeout: 3s
      retries: 20
    volumes:
      - ksops_postgres_data:/var/lib/postgresql/data

volumes:
  ksops_postgres_data:
